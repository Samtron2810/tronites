<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/src/assets/tronite-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Tronites</title>
  </head>
  <body style="background-color: #04342c">
    <div id="root">
      <div
        id="static-splash"
        style="
          position: fixed;
          inset: 0;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          background-color: #04342c;
          z-index: 9999;
        "
      >
        <img
          src="/src/assets/tronite-logo.png"
          alt="Tronites"
          style="height: 64px; width: auto; object-fit: contain"
        />
        <span
          style="
            margin-top: 16px;
            color: #ffffff;
            font-family: &quot;DM Sans&quot;, sans-serif;
            font-weight: 700;
            font-size: 24px;
            letter-spacing: -0.02em;
          "
        >
          Tron<span style="color: #9fe1cb">ites</span>
        </span>
        <style>
          #static-splash img,
          #static-splash span {
            animation: staticSplashPulse 1.2s ease-in-out infinite;
          }
          #static-splash span {
            animation-delay: 0.15s;
          }
          @keyframes staticSplashPulse {
            0%,
            100% {
              opacity: 1;
            }
            50% {
              opacity: 0.6;
            }
          }
        </style>
      </div>
    </div>
    <!-- Cloudinary Upload Widget — used only for video uploads (see
         src/services/cloudinaryWidget.js). Loaded here rather than as an
         npm package since Cloudinary ships it as a browser global
         (`window.cloudinary`), not an ES module. -->
    <script src="https://upload-widget.cloudinary.com/latest/global/all.js"></script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
