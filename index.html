<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Apply the saved theme before first paint (same rules as
         ThemeProvider) so the splash and page never flash the wrong
         palette. -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("theme");
          var dark =
            saved === "dark" ||
            (saved !== "light" &&
              window.matchMedia &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) {
            document.documentElement.classList.add("dark");
            var m = document.querySelector('meta[name="theme-color"]');
            if (m) m.setAttribute("content", "#14120e");
          }
        } catch (e) {}
      })();
    </script>
    <style>
      html { background-color: #f4eee1; }
      html.dark { background-color: #14120e; }
      #static-splash {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        background-color: #f4eee1; color: #16140f;
      }
      html.dark #static-splash { background-color: #14120e; color: #f4eee1; }
      #static-splash img { height: 64px; width: auto; object-fit: contain; border-radius: 12px; mix-blend-mode: multiply; }
      html.dark #static-splash img { mix-blend-mode: normal; }
      #static-splash .splash-word {
        margin-top: 12px;
        font-family: "Bricolage Grotesque", "DM Sans", system-ui, sans-serif;
        font-weight: 800; font-size: 36px; letter-spacing: -0.04em; line-height: 1.1;
      }
      #static-splash .splash-bar {
        margin-top: 16px; width: 64px; height: 6px; border-radius: 9999px; background: #f2b531;
      }
      #static-splash img, #static-splash .splash-word {
        animation: staticSplashPulse 1.2s ease-in-out infinite;
      }
      #static-splash .splash-word { animation-delay: 0.15s; }
      @keyframes staticSplashPulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
    </style>
    <link rel="icon" type="image/png" href="/tronite-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />

    <!-- 4.5 — PWA manifest + install metadata. Icons/manifest generated
         by vite-plugin-pwa at build time (vite.config.js); this file
         only needs the static tags a plain HTML page can't get from
         the build plugin automatically. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#f4eee1" />

    <!-- iOS has no manifest support for install/standalone metadata —
         these three tags are what makes "Add to Home Screen" launch
         without Safari chrome and use the right icon/status bar style. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Tronites" />
    <link rel="apple-touch-icon" href="/pwa-192.png" />

    <!-- Open Graph / Twitter — default preview for any Tronites link
         shared without a specific post (roadmap 2.5 covers per-post
         previews separately). -->
    <meta property="og:title" content="Tronites" />
    <meta property="og:description" content="Connect, post, and chat in real time." />
    <meta property="og:image" content="/pwa-512.png" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />

    <!-- DM Sans is self-hosted (@fontsource/dm-sans, imported in
         src/index.css) so visitors' IP addresses are not sent to Google
         Fonts — see the Privacy Policy. -->
    <title>Tronites</title>
  </head>
  <body>
    <div id="root">
      <div id="static-splash">
        <img src="/tronite-logo.png" alt="Tronites" />
        <span class="splash-word">tronites</span>
        <span class="splash-bar"></span>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
